# Settings for `cargo about`, which writes THIRD-PARTY-NOTICES.md (the licences of the Rust
# libraries that ship inside Wisply). Regenerate with:
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
]
# Only what ships in the Windows program.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
