[package]
name = "wisply"
version = "0.0.1"
description = "Wisply: small single-purpose wisps in your system tray"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
log = "0.4"
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
wisply-core = { path = "../crates/core" }
